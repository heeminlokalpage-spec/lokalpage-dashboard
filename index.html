<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lokalpage Weekly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563EB;--blue-l:#EFF6FF;
  --green:#16A34A;--green-l:#F0FDF4;
  --orange:#EA580C;--orange-l:#FFF7ED;
  --bg:#F8F9FB;--white:#FFFFFF;
  --border:#E5E7EB;--border2:#F0F2F5;
  --t1:#0F172A;--t2:#64748B;--t3:#94A3B8;
  --up:#16A34A;--dn:#DC2626;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
html,body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--t1);min-height:100vh}
.page{width:100%;max-width:480px;margin:0 auto}

/* HEADER */
.hd{padding:16px 20px 13px;background:var(--white);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hd-title{font-size:14px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.hd-date{font-size:10px;color:var(--t3);margin-top:2px;font-weight:500}
.hd-right{display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:4px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:99px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--green)}
.live-dot{width:5px;height:5px;border-radius:50%;background:#22C55E;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.rbtn{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rbtn svg{width:11px;height:11px;stroke:var(--t2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rspin{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* SECTIONS */
.content{display:flex;flex-direction:column}
.sec{padding:14px 16px 10px}
.sec-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-num{font-size:9px;font-weight:800;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 6px}
.sec-title{font-size:14px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.hdiv{height:1px;background:var(--border2);margin:0 16px}

/* CITY CARDS */
.city-cards{display:flex;flex-direction:column;gap:7px}
.cc{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;box-shadow:var(--shadow)}
.cc::before{content:'';width:3px;flex-shrink:0}
.cc.cebu::before{background:var(--blue)}
.cc.bohol::before{background:var(--green)}
.cc.bali::before{background:var(--orange)}
.cc-inner{flex:1;display:flex;padding:11px 12px 10px;gap:10px;align-items:stretch}
.cc-stats{display:flex;flex-direction:column;gap:6px;flex-shrink:0;width:120px}
.cc-city-row{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.cc-city-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cc-city-name{font-size:11px;font-weight:800}
.cc.cebu .cc-city-name{color:var(--blue)}
.cc.bohol .cc-city-name{color:var(--green)}
.cc.bali .cc-city-name{color:var(--orange)}
.cc-book-val{font-size:32px;font-weight:900;letter-spacing:-.06em;line-height:1}
.cc.cebu .cc-book-val{color:var(--blue)}
.cc.bohol .cc-book-val{color:var(--green)}
.cc.bali .cc-book-val{color:var(--orange)}
.cc-book-lbl{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-left:5px}
.cc-booking{display:flex;align-items:baseline}
.cc-delta{font-size:10px;font-weight:700;margin-top:3px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--t3)}
.cc-sub-metrics{display:flex;gap:10px;margin-top:4px}
.cc-sub{display:flex;flex-direction:column}
.cc-sub-val{font-size:13px;font-weight:700;color:var(--t1);letter-spacing:-.02em}
.cc-sub-lbl{font-size:8px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.cc-reviews{flex:1;border-left:1px solid var(--border2);padding-left:10px;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.cc-reviews:hover{opacity:.85}
.rv{display:flex;flex-direction:column;flex:1;justify-content:flex-start;padding:6px 0 4px}
.rv+.rv{border-top:1px solid var(--border2)}
.rv-tag{font-size:7.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.rv-tag.pos{color:var(--green)}.rv-tag.neg{color:var(--orange)}
.rv-text{font-size:9px;line-height:1.5;color:var(--t2);font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.rv-empty{font-size:9px;color:var(--t3);font-weight:500}

/* CHARTS */
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 14px 10px;box-shadow:var(--shadow)}
.chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-title{font-size:12px;font-weight:700;color:var(--t1)}
.legend{display:flex;gap:10px}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:7px;height:7px;border-radius:50%}
.leg-lbl{font-size:9px;color:var(--t2);font-weight:600}
.chart-inner{position:relative;height:160px;width:100%}

/* SUM CARDS */
.sum30{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.sum-card{background:var(--white);border-radius:10px;padding:9px 10px;border:1px solid var(--border);box-shadow:var(--shadow)}
.sum-val{font-size:17px;font-weight:800;letter-spacing:-.04em}
.sum-sub{font-size:9px;font-weight:700;margin-top:1px}
.sum-lbl{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;font-weight:600}

/* COMPETITOR */
.comp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.comp-block{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 11px 9px;box-shadow:var(--shadow)}
.comp-city-head{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.comp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.comp-city-name{font-size:10px;font-weight:800}
.comp-item{margin-bottom:7px}
.comp-item:last-child{margin-bottom:0}
.comp-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.comp-name{font-size:8.5px;font-weight:500;color:var(--t2)}
.comp-name.us{font-weight:800;color:var(--t1)}
.comp-tag{font-size:7px;color:var(--t3)}
.bar-bg{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bar-us{background:var(--t1)}.bar-ot{background:#D1D5DB}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:var(--white);border-radius:24px 24px 0 0;border:1px solid var(--border);padding:22px 20px 40px;width:100%;max-width:500px;transform:translateY(24px);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modal-bg.open .modal{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:14px}
.ctabs{display:flex;gap:6px;margin-bottom:14px}
.ctab{padding:5px 14px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--t2);cursor:pointer;font-family:inherit}
.ctab.active.cebu{background:var(--blue-l);color:var(--blue);border-color:#BFDBFE}
.ctab.active.bohol{background:var(--green-l);color:var(--green);border-color:#BBF7D0}
.ctab.active.bali{background:var(--orange-l);color:var(--orange);border-color:#FED7AA}
.mlbl{font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;display:block}
.mta{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--t1);resize:none;outline:none;min-height:80px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.mta:focus{border-color:#93C5FD;background:var(--white)}
.mta::placeholder{color:var(--t3)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mb-cancel{padding:12px;border:1.5px solid var(--border);background:var(--bg);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer}
.mb-save{padding:12px;border:none;background:var(--t1);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer}

/* LOADING */
.loading{position:fixed;inset:0;background:rgba(248,249,251,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:100;transition:opacity .3s}
.loading.out{opacity:0;pointer-events:none}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--t1);animation:rot .65s linear infinite}
.loading-lbl{font-size:11px;font-weight:600;color:var(--t2)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--t1);color:#fff;padding:8px 18px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;transition:all .28s ease;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}



@media(min-width:600px){.page{max-width:520px}}
@media(min-width:960px){.page{max-width:560px}}
</style>
</head>
<body>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Featured Reviews</div>
    <div class="ctabs">
      <button class="ctab cebu active" onclick="switchTab('Cebu',this)">Cebu</button>
      <button class="ctab bohol" onclick="switchTab('Bohol',this)">Bohol</button>
      <button class="ctab bali" onclick="switchTab('Bali',this)">Bali</button>
    </div>
    <label class="mlbl">↑ Top Feedback</label>
    <textarea class="mta" id="posInput" placeholder="한 줄에 하나씩 입력…" rows="3" onkeydown="handleEnter(event,this)"></textarea>
    <label class="mlbl">↓ Key Complaint</label>
    <textarea class="mta" id="negInput" placeholder="한 줄에 하나씩 입력…" rows="3" onkeydown="handleEnter(event,this)"></textarea>
    <div class="mbtns">
      <button class="mb-cancel" onclick="closeModal()">Cancel</button>
      <button class="mb-save" onclick="saveReviews()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<div class="loading" id="loading">
  <div class="spinner"></div>
  <span class="loading-lbl">Loading…</span>
</div>

<div class="page" id="theDash">
  <div class="hd">
    <div>
      <div class="hd-title">LOKALPAGE WEEKLY DATA</div>
      <div class="hd-date" id="syncTime">DATE: –</div>
    </div>
    <div class="hd-right">
      <div class="live-pill"><span class="live-dot"></span>Live</div>
      <button class="rbtn" onclick="doCapture()" title="캡쳐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button class="rbtn" onclick="loadData(true)">
        <svg id="rIco" viewBox="0 0 24 24">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="content">
    <div class="sec">
      <div class="sec-hd"><span class="sec-num">01</span><span class="sec-title">Last 7 Days</span></div>
      <div class="city-cards" id="cityCards"></div>
    </div>
    <div class="hdiv"></div>
    <div class="sec">
      <div class="sec-hd"><span class="sec-num">02</span><span class="sec-title">Last 30 Days</span></div>
      <div class="chart-card">
        <div class="chart-top">
          <span class="chart-title">Daily Bookings</span>
          <div class="legend">
            <div class="leg"><div class="leg-dot" style="background:#2563EB"></div><span class="leg-lbl">Cebu</span></div>
            <div class="leg"><div class="leg-dot" style="background:#16A34A"></div><span class="leg-lbl">Bohol</span></div>
            <div class="leg"><div class="leg-dot" style="background:#EA580C"></div><span class="leg-lbl">Bali</span></div>
          </div>
        </div>
        <div class="chart-inner"><canvas id="c30"></canvas></div>
      </div>
      <div class="sum30" id="sum30"></div>
    </div>
    <div class="hdiv"></div>
    <div class="sec">
      <div class="sec-hd"><span class="sec-num">03</span><span class="sec-title">Monthly Bookings (2026)</span></div>
      <div class="chart-card">
        <div class="chart-top">
          <span class="chart-title">Bookings by Month · 2026</span>
          <div class="legend">
            <div class="leg"><div class="leg-dot" style="background:#2563EB"></div><span class="leg-lbl">Cebu</span></div>
            <div class="leg"><div class="leg-dot" style="background:#16A34A"></div><span class="leg-lbl">Bohol</span></div>
            <div class="leg"><div class="leg-dot" style="background:#EA580C"></div><span class="leg-lbl">Bali</span></div>

      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><span class="sec-num">04</span><span class="sec-title">Competitor Price Index</span></div>
      <div class="comp-grid" id="compGrid"></div>
    </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxV5JkHh1BePI5Vs4f8fIurdOxzyzovNtuSX937pT7c6dWTnjOcRCpPHRA2aMBWO08Jzg/exec";
const CITIES = ['Cebu','Bohol','Bali'];
const COL = {Cebu:'#2563EB',Bohol:'#16A34A',Bali:'#EA580C'};
const CLS = {Cebu:'cebu',Bohol:'bohol',Bali:'bali'};

// 날짜 문자열에서 n일 빼기
function subDays(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() - n);
  return dt.getFullYear() + '-' +
    String(dt.getMonth()+1).padStart(2,'0') + '-' +
    String(dt.getDate()).padStart(2,'0');
}

function normalize(raw) {
  if(!raw) return {rows:[], reviewData:{}};
  // raw가 배열이면 이전 구조, 객체면 새 구조
  const dataRows = Array.isArray(raw) ? raw : (raw.rows || []);
  const reviewData = raw.reviewData || {};
  const rows = dataRows.filter(r => r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date))
    .map(r => ({
      date:       r.date,
      cebu_book:  Number(r.cebu_book) ||0,
      cebu_guest: Number(r.cebu_guest)||0,
      bali_book:  Number(r.bali_book) ||0,
      bali_guest: Number(r.bali_guest)||0,
      bohol_book: Number(r.bohol_book)||0,
      bohol_guest:Number(r.bohol_guest)||0,
    }));
  return { rows, reviewData };
}

function process(rows, reviewData) {
  // 데이터의 마지막 날짜 기준
  const sorted = rows.map(r=>r.date).sort();
  const last = sorted[sorted.length-1]; // 예: 2026-05-28

  const rng = (f,t) => rows.filter(r => r.date >= f && r.date <= t);
  const sum = (arr, k) => arr.reduce((s,r) => s+(r[k]||0), 0);
  const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;

  // Last 7 days: last~last-6 (예: 5/22~5/28)
  const w1s = subDays(last, 6);  // 5/22
  const w1e = last;               // 5/28
  const w2s = subDays(last, 13); // 5/15
  const w2e = subDays(last, 7);  // 5/21

  const r7  = rng(w1s, w1e);
  const r7p = rng(w2s, w2e);

  // Last 30 days
  const m1s = subDays(last, 29);
  const m2s = subDays(last, 59);
  const m2e = subDays(last, 30);
  const r30  = rng(m1s, w1e);
  const r30p = rng(m2s, m2e);

  // 리뷰레이트: start_date 기준 1~7일전, LOKALPAGE 채널만
  function reviewRate(city) {
    let total = 0, reviewed = 0;
    for (let i = 0; i < 7; i++) {
      const ds = subDays(last, i + 1); // 어제~7일전
      const d = reviewData[ds] && reviewData[ds][city];
      if (d) { total += d.total; reviewed += d.reviewed; }
    }
    return total > 0 ? Math.round(reviewed / total * 100) : 0;
  }

  const stats = {
    Cebu:  {bookings:sum(r7,'cebu_book'),  guests:sum(r7,'cebu_guest'),  rate:reviewRate('cebu'),  pb:sum(r7p,'cebu_book'),  pg:sum(r7p,'cebu_guest')},
    Bohol: {bookings:sum(r7,'bohol_book'), guests:sum(r7,'bohol_guest'), rate:reviewRate('bohol'), pb:sum(r7p,'bohol_book'), pg:sum(r7p,'bohol_guest')},
    Bali:  {bookings:sum(r7,'bali_book'),  guests:sum(r7,'bali_guest'),  rate:reviewRate('bali'),  pb:sum(r7p,'bali_book'),  pg:sum(r7p,'bali_guest')},
  };

  const agg30 = {
    Cebu:  {bookings:sum(r30,'cebu_book'),  pb:sum(r30p,'cebu_book')},
    Bohol: {bookings:sum(r30,'bohol_book'), pb:sum(r30p,'bohol_book')},
    Bali:  {bookings:sum(r30,'bali_book'),  pb:sum(r30p,'bali_book')},
  };

  // 30일 차트
  const lbl30=[]; const d30={Cebu:[],Bohol:[],Bali:[]};
  for(let i=29;i>=0;i--) {
    const ds = subDays(last, i);
    lbl30.push(ds.slice(5)); // MM-DD
    const row = rows.find(r=>r.date===ds)||{};
    d30.Cebu.push(row.cebu_book||0);
    d30.Bohol.push(row.bohol_book||0);
    d30.Bali.push(row.bali_book||0);
  }

  // 월별 차트
  const months=[]; const mo={Cebu:[],Bohol:[],Bali:[]};
  const yr = new Date(last+'T00:00:00').getFullYear();
  const curM = new Date(last+'T00:00:00').getMonth();
  for(let m=0;m<=curM;m++) {
    const ms = yr+'-'+String(m+1).padStart(2,'0');
    months.push(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]);
    const mr = rows.filter(r=>r.date.startsWith(ms));
    mo.Cebu.push(mr.reduce((s,r)=>s+(r.cebu_book||0),0));
    mo.Bohol.push(mr.reduce((s,r)=>s+(r.bohol_book||0),0));
    mo.Bali.push(mr.reduce((s,r)=>s+(r.bali_book||0),0));
  }

  return {stats, agg30, lbl30, d30, months, mo};
}

function delta(c,p) {
  if(p==null) return '';
  const d=c-p;
  const cls=d>0?'up':d<0?'dn':'fl', a=d>0?'↑':d<0?'↓':'→';
  return `<div class="cc-delta ${cls}">${a}${d>0?'+':''}${d}</div>`;
}

// localStorage에서 저장된 리뷰 불러오기
function loadRv() {
  const def = {Cebu:{pos:'',neg:''},Bohol:{pos:'',neg:''},Bali:{pos:'',neg:''}};
  try {
    const saved = localStorage.getItem('lp_reviews');
    if (!saved) return def;
    const parsed = JSON.parse(saved);
    // 각 도시 기본값 보장
    ['Cebu','Bohol','Bali'].forEach(c => {
      if (!parsed[c]) parsed[c] = {pos:'',neg:''};
      if (parsed[c].pos === undefined) parsed[c].pos = '';
      if (parsed[c].neg === undefined) parsed[c].neg = '';
    });
    return parsed;
  } catch { return def; }
}
function saveRv() {
  try { localStorage.setItem('lp_reviews', JSON.stringify(rv)); } catch {}
}

const rv = loadRv();
let modalCity='Cebu', lastStats=null;

// 원화 기준 가격 (바 비교용)
const COMP={
  Cebu: [
    {n:'Flex',      v:210000, us:false},
    {n:'LOKALPAGE', v:224000, us:true},
    {n:'Treeshade', v:227000, us:false},
  ],
  Bohol:[
    {n:'Boholtravel',v:90000, us:false},
    {n:'DFree',      v:90000, us:false},
    {n:'LOKALPAGE',  v:89000, us:true},
  ],
  Bali: [
    {n:'Apong',     v:95000,  us:false},
    {n:'Wayan',     v:105000, us:false},
    {n:'LOKALPAGE', v:110000, us:true},
  ],
};
function renderComp() {
  document.getElementById('compGrid').innerHTML = CITIES.map(c => {
    const list = [...COMP[c]].sort((a,b) => a.v - b.v); // 낮은 가격 순
    const mn = Math.min(...list.map(x=>x.v));
    const mx = Math.max(...list.map(x=>x.v));
    const range = mx - mn || 1;

    return `<div class="comp-block">
      <div class="comp-city-head">
        <div class="comp-dot" style="background:${COL[c]}"></div>
        <span class="comp-city-name" style="color:${COL[c]}">${c}</span>
      </div>
      ${list.map(x => {
        // 최저가 대비 % 차이로 바 길이 계산 (과장해서 차이 강조)
        const pct = Math.round((x.v - mn) / range * 100);
        const barW = 60 + pct * 0.4; // 60%~100% 범위 (자연스럽게)
        const usPrice = list.find(i=>i.us)?.v || 0;
        const diffPct = usPrice > 0 ? (((x.v - usPrice) / usPrice) * 100).toFixed(1) : 0;
        const tag = x.us
          ? `<span style="font-size:8px;color:${COL[c]};font-weight:700">◆ Base</span>`
          : x.v > usPrice
            ? `<span style="font-size:8px;color:var(--dn);font-weight:700">+${diffPct}%</span>`
            : x.v < usPrice
              ? `<span style="font-size:8px;color:var(--up);font-weight:700">${diffPct}%</span>`
              : `<span style="font-size:8px;color:var(--t3)">Same</span>`;
        return `<div class="comp-item">
          <div class="comp-name-row">
            <span class="comp-name${x.us?' us':''}">${x.n}</span>
            ${tag}
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="background:${x.us?'#F97316':'#1E293B'};width:0" data-w="${barW.toFixed(0)}%"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill[data-w]').forEach(el=>el.style.width=el.dataset.w);
  }));
}

function openModal(c) {
  modalCity=c;
  document.querySelectorAll('.ctab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.ctab.${CLS[c]}`).classList.add('active');
  const _pos = (rv[c] && rv[c].pos) ? rv[c].pos.trim() : '';
  const _neg = (rv[c] && rv[c].neg) ? rv[c].neg.trim() : '';
  document.getElementById('posInput').value = _pos || '1. ';
  document.getElementById('negInput').value = _neg || '1. ';
  document.getElementById('modalBg').classList.add('open');
  setTimeout(() => {
    const p = document.getElementById('posInput');
    p.focus();
    p.selectionStart = p.selectionEnd = p.value.length;
  }, 100);
}
function switchTab(c,btn) {
  // 현재 탭 내용 저장
  rv[modalCity].pos = document.getElementById('posInput').value.trim();
  rv[modalCity].neg = document.getElementById('negInput').value.trim();
  modalCity = c;
  document.querySelectorAll('.ctab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  // 새 탭 내용 불러오기 (없으면 1. 으로 시작)
  const pos = (rv[c] && rv[c].pos) ? rv[c].pos.trim() : '';
  const neg = (rv[c] && rv[c].neg) ? rv[c].neg.trim() : '';
  document.getElementById('posInput').value = pos || '1. ';
  document.getElementById('negInput').value = neg || '1. ';
}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
// Enter 키 시 다음 줄에 번호 자동 추가 (한글 IME 중복 방지)
function handleEnter(e, el) {
  if (e.key !== 'Enter') return;
  if (e.isComposing) return; // 한글 조합 중엔 무시
  e.preventDefault();
  const val = el.value;
  const pos = el.selectionStart;
  const lines = val.substring(0, pos).split('\n');
  const nextNum = lines.length + 1;
  const insert = '\n' + nextNum + '. ';
  el.value = val.substring(0, pos) + insert + val.substring(pos);
  el.selectionStart = el.selectionEnd = pos + insert.length;
}

function addNumbers(text) {
  return text.split('\n')
    .filter(l => l.trim())
    .map((l, i) => {
      // 이미 번호 있으면 제거 후 다시 매기기
      const clean = l.replace(/^\d+\.\s*/, '').trim();
      return clean ? `${i+1}. ${clean}` : '';
    })
    .filter(l => l)
    .join('\n');
}

function saveReviews(){
  rv[modalCity].pos = addNumbers(document.getElementById('posInput').value);
  rv[modalCity].neg = addNumbers(document.getElementById('negInput').value);
  saveRv(); // localStorage에 저장
  closeModal();
  if(lastStats) renderCities(lastStats);
  toast('Saved');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

async function doCapture(){
  toast('Saving…');
  try{
    const c=await html2canvas(document.getElementById('theDash'),{scale:3,useCORS:true,backgroundColor:'#F8F9FB',logging:false});
    c.toBlob(async blob=>{
      try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('Copied!');}
      catch{const a=document.createElement('a');a.href=c.toDataURL();a.download='lokalpage.png';a.click();toast('Saved!');}
    },'image/png');
  }catch{toast('Failed')}
}

async function loadData(manual=false){
  const ld=document.getElementById('loading');
  const ico=document.getElementById('rIco');
  ld.classList.remove('out');
  ico.classList.add('rspin');
  // 수동 새로고침 시 리뷰 초기화
  if(manual){
    CITIES.forEach(c=>{rv[c].pos='';rv[c].neg='';});
    saveRv();
  }
  try{
    let rows;
    try{
      const res=await fetch(GAS_URL,{redirect:'follow'});
      const raw=await res.json();
      // raw가 {rows,reviewData} 객체이거나 배열일 수 있음
      rows=normalize(raw);
    }catch(fetchErr){
      rows=await new Promise((resolve,reject)=>{
        const cb='_cb'+Date.now();
        const s=document.createElement('script');
        const t=setTimeout(()=>{reject(new Error('timeout'));s.remove();delete window[cb];},15000);
        window[cb]=data=>{
          clearTimeout(t);delete window[cb];s.remove();
          resolve(normalize(data));
        };
        s.src=GAS_URL+'?callback='+cb;
        s.onerror=()=>{clearTimeout(t);reject(new Error('load'));};
        document.head.appendChild(s);
      });
    }
    console.log('rows result:', rows);
    if(!rows||!rows.rows||rows.rows.length===0) throw new Error('no data');
    const p=process(rows.rows, rows.reviewData||{});
    lastStats=p.stats;
    renderCities(p.stats);
    renderSum30(p.agg30);
    renderC30(p.lbl30,p.d30);
    renderC6m(p.months,p.mo);
    renderComp();
    const now=new Date();
    document.getElementById('syncTime').textContent='DATE: '+
      now.toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'});
    if(manual) toast('Refreshed');
  }catch(e){
    console.error(e);
    toast('Sync failed');
  }finally{
    ld.classList.add('out');
    ico.classList.remove('rspin');
  }
}

loadData();
